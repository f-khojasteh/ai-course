server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: changeflow
  datasource:
    url: ${CHANGEFLOW_DATABASE_URL:jdbc:h2:file:./data/changeflow}
    username: ${CHANGEFLOW_DATABASE_USERNAME}
    password: ${CHANGEFLOW_DATABASE_PASSWORD}
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SET LOCK_TIMEOUT 2000
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
